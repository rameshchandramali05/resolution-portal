  <script>
    let bankRawData = [];

/* -------- Merge bill rows -------- */
function mergeBillRows(data){
  const merged = [];
  let current = null;
  const textCols = [3,6];
  const displayCols = [4,5,7,8];
  data.forEach(r=>{
    const billNo = (r[1]||"").toString().trim();
    if(billNo!==""){
      current = [...r];
      textCols.forEach(i=>{ if(current[i]) current[i]="• "+current[i]; });
      merged.push(current);
    } else if(current){
      textCols.forEach(i=>{ if(r[i]) current[i]+="<br>• "+r[i]; });
      displayCols.forEach(i=>{ if(r[i]) current[i]+="<br>"+r[i]; });
    }
  });
  return merged;
}

/* -------- Parse Indian date -------- */
function parseIndianDate(dateStr){
  if(!dateStr) return null;
  if(!dateStr || !dateStr.includes("-"))
return null;

const parts = dateStr.split("-");



  const day = parseInt(parts[0]);
  const month = parseInt(parts[1])-1;
  const year = parseInt(parts[2]);
  return new Date(year, month, day);
}

/* -------- Financial Year Helper -------- */
function getFinancialYear(date){
  const y=date.getFullYear(), m=date.getMonth()+1;
  return m>=4? y+"-"+(y+1) : (y-1)+"-"+y;
}

/* -------- Add FY summary -------- */
function addFinancialYearSummary(data){

  let result=[]
  let currentFY=null

  let income=0
  let expense=0
  let cash=0
  let bank=0

  data.forEach((r,i)=>{

    const d=parseIndianDate(r[0])
    if(!d){
      result.push(r)
      return
    }

    const fy=getFinancialYear(d)

    if(currentFY===null){
      currentFY=fy
    }

    /* FY change */
    if(fy!==currentFY){

      result.push([
        "","","",
        `🔶 FY ${currentFY} SUMMARY`,
        income,
        expense,
        "",
        cash,
        bank,
        "","",""
      ])

      income=0
      expense=0
      cash=0
      bank=0

      currentFY=fy
    }

    income+=Number(r[4]||0)
    expense+=Number(r[5]||0)
    cash+=Number(r[7]||0)
    bank+=Number(r[8]||0)

    result.push(r)

  })

  /* Last FY summary */

  if(currentFY){

    result.push([
      "","","",
      `🔶 FY ${currentFY} SUMMARY`,
      income,
      expense,
      "",
      cash,
      bank,
      "","",""
    ])

  }

  return result
}

function formatAmount(num){
  num = Number(num || 0);
  return num.toLocaleString("en-IN",{
  minimumFractionDigits:0,
  maximumFractionDigits:2
});
}


function safeDate(v){
  if(!v) return "";

  // Google Sheet / JS date string clean
  const d = new Date(v);
  if(isNaN(d)) return "";

  const day = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  const year = d.getFullYear();

  return `${day}-${month}-${year}`;
}








/* -------- Filter -------- */
function filterByDateBank(){

  const fromVal=document.getElementById("bankFromDate").value
  const toVal=document.getElementById("bankToDate").value
  const mode=document.getElementById("modeFilter").value

  const from=fromVal? new Date(fromVal):null
  const to=toVal? new Date(toVal):null

  let openingCash=0
  let openingBank=0

  /* opening balance calculate */

  if(from){

    bankRawData.forEach(r=>{

      const d=parseIndianDate(r[0])
      if(!d) return

      if(d < from){

        openingCash += Number(r[7]||0)
        openingBank += Number(r[8]||0)

      }

    })

  }

  const filtered=bankRawData.filter(r=>{

    const d=parseIndianDate(r[0])
    if(!d) return false

    if(from && d < from) return false
    if(to && d > to) return false

    const rowMode=(r[6]||"").toLowerCase()

    if(mode==="cash" && !rowMode.includes("cash")) return false
    if(mode==="bank" && !rowMode.includes("bank")) return false

    return true

  })

  buildBankPages(filtered,openingCash,openingBank)

}

}
async function downloadPDF() {

  try {

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({
      orientation: "landscape",
      unit: "mm",
      format: "a4"
    });

    const originalPages =
      document.querySelectorAll(".bank-page-box");

    const pdfWidth = 287;

    for (let i = 0; i < originalPages.length; i++) {

      /* ===== CLONE ===== */

      const clone =
        originalPages[i].cloneNode(true);

      clone.style.transform = "scale(1)";
      clone.style.left = "0";
      clone.style.position = "absolute";
      clone.style.top = "-99999px";
      clone.style.marginBottom = "0";
      clone.style.width = "1123px";
      clone.style.zIndex = "-1";

      document.body.appendChild(clone);

      await new Promise(r => setTimeout(r, 100));

      const canvas = await html2canvas(clone, {
          scale: 3,

        useCORS: true,

        allowTaint: true,

        backgroundColor: "#ffffff",

        logging: false

      });

      const imgData =
canvas.toDataURL("image/png");

      const imgHeight =
        (canvas.height * pdfWidth) / canvas.width;

      if (i > 0) {
        pdf.addPage();
      }

      pdf.addImage(
imgData,
"PNG",
        5,
        5,
        pdfWidth,
        imgHeight
      );

      /* ===== REMOVE CLONE ===== */

      document.body.removeChild(clone);
    }

    pdf.save("Bank+Cash-Report(BMSSSR).pdf");

  } catch (err) {

    console.log(err);

    alert("PDF Error : " + err.message);
  }
}
